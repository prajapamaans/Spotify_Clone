<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            
            <title> </title>
        <link rel="stylesheet" href="style.css">
        </head>
<body>
    <nav>
        <ul>
            <li class="brand"><img src="logo.png" alt="Spotify"> Spotify</li>

        <div class="songList">
            <h1>Best of Arijit - No Copyright Sounds</h1>
            <div class="songItemContainer">
                <div class="songItem">
                    <img src="co/1.jpg">

                    <span class="songlistplay"><span class="timestamp">04:30 <i id="0" class="far songItemPlay fa-play-circle"></i> </span></span>
                </div>

                    <img src="co/2.jpg">
                    <span class="songName">Muskurane</span>

                <div class="songItem">
                    <img src="co/6.jpg">
                    <span class="songName">Shayad</span>

                </div>
                <div class="songItem">
                    <img src="co/7.jpg">
                    <span class="songName">Ghungroo</span>
                    <span class="songlistplay"><span class="timestamp">05:02 <i id="6" class="far songItemPlay fa-play-circle"></i> </span></span>
                </div>
                <div class="songItem">
                    <img src="co/8.jpg">
                    <span class="songName">Nashe Si Chadh Gayi </span>

                </div>
                <div class="songItem">
                    <img src="co/9.jpg">

                <div class="songItem">

                </div>
            </div>
            <div class="songBanner"></div>
    </div>
    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100" style="position: absolute; left:110px;top:10px;" />
        <div class="icons">
            <!--fontawesome icons-->
            <i class="fa-solid fa-2x fa-backward-step" id=previous></i>
            <i class="fa-regular fa-2x fa-circle-play" id="masterplay"></i>
            <i class="fa-solid fa-2x fa-forward-step" id="next"></i>

        </div>
        <div class="songInfo" >
            <img src="playing.gif" width="30px" alt="play" id="gif" > &nbsp;<span id="masterSongName">khairiyat - Arijit Singh</span>
        </div>
        </div>
        <script src="https://kit.fontawesome.com/fddaa0687a.js" crossorigin="anonymous"></script> 
    <script src="./script1.js"></script>
